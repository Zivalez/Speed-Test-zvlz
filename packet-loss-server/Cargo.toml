[package]
name = "openpacketloss-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
bytes = "1.5"
dotenvy = "0.15"
interceptor = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
webrtc = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

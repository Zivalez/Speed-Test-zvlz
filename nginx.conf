server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    client_max_body_size 35m;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 75s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip off;

    error_page 405 =200 $uri;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location = /node-info.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /webrtc/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
    }

    location = /upload {
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control" always;
        add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /downloading {
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;
        etag off;
        expires off;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /packet-loss/ {
        try_files $uri $uri/ /packet-loss/index.html;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

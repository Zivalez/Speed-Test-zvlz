limit_conn_zone $binary_remote_addr zone=zvlz_per_ip:10m;
limit_req_zone $binary_remote_addr zone=zvlz_signaling:10m rate=5r/s;

map $uri $zvlz_cache_control {
    default "no-store";
    ~^/(?:upload|downloading)$ "no-store, no-cache, max-age=0, no-transform";
    =/node-info.json "no-store, no-cache, must-revalidate";
    "~^/(?:assets|packet-loss)/.+\.[0-9a-f]{12}\.(?:css|js)$" "public, max-age=31536000, immutable";
    ~*\.(?:woff2?|ttf|eot)$ "public, max-age=2592000";
    ~^/assets/ "public, max-age=86400, must-revalidate";
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    client_max_body_size 35m;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    limit_conn zvlz_per_ip 64;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    add_header Cache-Control $zvlz_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' stun:; font-src 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'" always;

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /build-info.json {
        try_files $uri =404;
        default_type application/json;
    }

    location = /node-info.json {
        alias /tmp/zvlz/node-info.json;
        default_type application/json;
    }

    location /webrtc/ {
        limit_req zone=zvlz_signaling burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_buffering off;
        proxy_request_buffering on;
    }

    location = /upload {
        gzip off;

        if ($request_method = OPTIONS) {
            return 204;
        }

        error_page 405 =204 @upload_complete;
        try_files /upload =404;
    }

    location @upload_complete {
        internal;
        return 204;
    }

    location = /downloading {
        gzip off;
        default_type application/octet-stream;
        max_ranges 0;
        etag off;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files /downloading =404;
    }

    location ~* "^/(?:assets|packet-loss)/.+\.[0-9a-f]{12}\.(?:css|js)$" {
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /packet-loss {
        return 308 /packet-loss/;
    }

    location /packet-loss/ {
        try_files $uri $uri/ /packet-loss/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

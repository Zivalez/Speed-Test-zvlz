server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    client_max_body_size 35m;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 75s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip off;

    # A POST to the empty /upload file normally returns 405. This internal
    # redirect returns 200 only after Nginx has consumed the request body.
    error_page 405 =200 $uri;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /upload {
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control" always;
        add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /downloading {
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store, no-cache, max-age=0, no-transform" always;
        etag off;
        expires off;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

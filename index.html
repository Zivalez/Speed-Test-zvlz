<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead7">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A private ZVLZ self-hosted network benchmark for speed, latency, jitter, and packet loss.">
  <meta property="og:title" content="ZVLZ Network Test">
  <meta property="og:description" content="Measure the route to the active ZVLZ node from your browser.">
  <title>ZVLZ | Network Test</title>

  <link rel="preconnect" href="https://prod.spline.design" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css?v=7">
  <link rel="stylesheet" href="assets/landing/hero.css?v=7">
  <script>
    function getCookieValue(name) {
      const match = document.cookie.match(`(^|;)\\s*${name}\\s*=\\s*([^;]+)`);
      return match ? match.pop() : "";
    }

    if (
      getCookieValue("mode") === "dark" ||
      (getCookieValue("mode") === "" && window.matchMedia?.("(prefers-color-scheme: dark)").matches)
    ) {
      document.head.insertAdjacentHTML(
        "beforeend",
        '<link id="darkmode" rel="stylesheet" href="assets/css/darkmode.css?v=6">'
      );
    }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/images/zvlz-mark.svg">
  <link rel="manifest" href="assets/images/icons/site.webmanifest">
</head>
<body>
  <a class="skip-link" href="#network-test">Skip to network test</a>
  <div id="zvlz-landing-root"></div>

  <main id="network-test" class="site-shell">
    <div id="loading_app" class="loader" role="status" aria-live="polite">
      <span class="loader-mark" aria-hidden="true">Z</span>
      <span class="loader-copy">Locating active node</span>
    </div>

    <object
      id="OpenSpeedTest-UI"
      data="assets/images/app.svg?v=7"
      type="image/svg+xml"
      aria-label="ZVLZ network speed test interface"
    ></object>

    <noscript>
      <section class="noscript-card">
        <strong>JavaScript is required.</strong>
        <span>This benchmark runs locally in your browser and needs JavaScript to measure the connection.</span>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <span>ZVLZ <span class="js-node-city">AUTO NODE</span></span>
    <span><span class="js-node-location">Locating node</span> · Self-hosted network benchmark</span>
  </footer>

  <script>
    // Add more endpoints here. The engine selects the node with the lowest latency.
    var openSpeedTestServerList = [
      {
        ServerName: "ZVLZ Auto Node",
        Download: "downloading",
        Upload: "upload",
        ServerIcon: "DefaultIcon"
      }
    ];

    var pingSamples = 10;
    var jitterFinalSample = 0.5;
    var setPingSamples = true;
    var pingTimeOut = 5000;
    var setPingTimeout = true;
    var pingMethod = "GET";
    var pingFile = "Upload";

    // Each upload request sends a 30 MiB random blob.
    var ulDataSize = 30;
    var ulDelay = 300;
    var dlDelay = 300;

    // Browser/protocol overhead compensation. Use ?Clean to disable it.
    var upAdjust = 1.04;
    var dlAdjust = 1.04;
    var enableClean = true;

    var dlDuration = 12;
    var ulDuration = 12;
    var dlThreads = 6;
    var ulThreads = 6;
    var setHTTPReq = true;

    // Optional result persistence. Disabled by default.
    var saveData = false;
    var saveDataURL = "/save-result";

    var stressTest = true;
    var selectTest = true;
    var selectServer = true;
    var enableRun = true;

    function ostOnload() {
      console.info("ZVLZ Network Test ready");
    }

    var openChannel = "dev";
  </script>
  <script src="assets/js/node-info.js?v=7"></script>
  <script type="module" src="assets/js/sound.js?v=6"></script>
  <script src="assets/js/spinning-counter.js?v=7"></script>
  <script src="assets/js/app-2.5.4.min.js?v=7"></script>
  <script src="assets/js/darkmode.js?v=6"></script>
  <script type="module" src="assets/landing/hero.js?v=7"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-app="speed-test">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead7">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A private ZVLZ self-hosted network benchmark for speed, latency, jitter, and packet loss.">
  <meta name="zvlz-build" content="__ZVLZ_BUILD_ID__">
  <meta property="og:title" content="ZVLZ Network Test">
  <meta property="og:description" content="Measure the route to the active ZVLZ node from your browser.">
  <title>ZVLZ | Network Test</title>

  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/images/zvlz-mark.svg">
  <link rel="manifest" href="/assets/images/icons/site.webmanifest">
</head>
<body>
  <a class="skip-link" href="#network-test">Skip to network test</a>

  <main id="network-test" class="site-shell">
    <div id="loading_app" class="loader" role="status" aria-live="polite">
      <span class="loader-mark" aria-hidden="true">Z</span>
      <span class="loader-copy">Locating active node</span>
    </div>

    <object
      id="OpenSpeedTest-UI"
      data="/assets/images/app.svg"
      type="image/svg+xml"
      aria-label="ZVLZ network speed test interface"
    ></object>

    <noscript>
      <section class="noscript-card">
        <strong>JavaScript is required.</strong>
        <span>This benchmark runs locally in your browser and needs JavaScript to measure the connection.</span>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <span>ZVLZ <span class="js-node-city">AUTO NODE</span></span>
    <span><span class="js-node-location">Locating node</span> · Self-hosted network benchmark</span>
  </footer>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/node-info.js"></script>
  <script type="module" src="/assets/js/sound.js"></script>
  <script src="/assets/js/app-2.5.4.js"></script>
  <script src="/assets/js/darkmode.js"></script>
</body>
</html>
